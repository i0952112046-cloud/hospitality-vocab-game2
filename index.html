<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專二餐服 雲端單字闖關與後台管理系統</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a 60%, #020617);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .portal-container {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: var(--glass-shadow);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .portal-btn-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 28px 20px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .portal-btn-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 12px 30px -5px rgba(99, 102, 241, 0.4);
      background: rgba(99, 102, 241, 0.12);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .student-icon {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.2));
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .teacher-icon {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(52, 211, 153, 0.2));
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .form-control {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
      width: 100%;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="glass-card">
      <h1>專二餐服 雲端單字闖關與管理入口</h1>
      <p class="subtitle">完全無伺服器即時連網架構 ｜ 課本雙頁一關卡 (P.3~P.4起) ｜ 85分及格解鎖</p>

      <div class="card-grid">
        <!-- 學生端按鈕 -->
        <a href="單字闖關遊戲.html" class="portal-btn-card">
          <div class="icon-wrapper student-icon">
            <i class="fa-solid fa-gamepad"></i>
          </div>
          <div class="card-title">學生端 闖關遊戲</div>
          <div class="card-desc">單字發音、隨機題目干擾項、動態進度條、實時上傳成績與解鎖關卡</div>
        </a>

        <!-- 教師端按鈕 (需點擊輸入密碼) -->
        <div class="portal-btn-card" onclick="openPasswordModal()">
          <div class="icon-wrapper teacher-icon">
            <i class="fa-solid fa-user-lock"></i>
          </div>
          <div class="card-title">教師端 即時後台 <i class="fa-solid fa-lock" style="font-size:0.85rem; color:var(--accent-amber);"></i></div>
          <div class="card-desc">點擊需填寫教師密碼 ｜ 全班進度圖表、單關分數檢視、一鍵匯出 Excel</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Password Verification Modal -->
  <div id="password-modal" class="modal-overlay">
    <div class="glass-card modal-content">
      <div style="font-size: 3rem; color: var(--primary); margin-bottom: 12px;">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="font-family: 'Outfit', sans-serif; margin-bottom: 8px;">進入教師後台權限驗證</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px;">請輸入教師管理密碼以繼續進入後台</p>

      <form onsubmit="verifyTeacherPassword(event)">
        <div style="margin-bottom: 16px;">
          <input type="password" id="modal-pass-input" class="form-control" placeholder="請輸入教師密碼" required autofocus>
        </div>
        <div id="modal-pass-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 14px; display: none;">
          <i class="fa-solid fa-circle-exclamation"></i> 密碼錯誤，請重新輸入！
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="button" class="btn" style="background: rgba(255,255,255,0.1);" onclick="closePasswordModal()">取消</button>
          <button type="submit" class="btn"><i class="fa-solid fa-key"></i> 驗證進入</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const TEACHER_PASSWORD = "teacher888";

    function openPasswordModal() {
      document.getElementById('password-modal').style.display = 'flex';
      document.getElementById('modal-pass-input').value = '';
      document.getElementById('modal-pass-error').style.display = 'none';
      document.getElementById('modal-pass-input').focus();
    }

    function closePasswordModal() {
      document.getElementById('password-modal').style.display = 'none';
    }

    function verifyTeacherPassword(e) {
      e.preventDefault();
      const val = document.getElementById('modal-pass-input').value.trim();

      if (val === TEACHER_PASSWORD) {
        sessionStorage.setItem('teacher_authenticated', 'true');
        window.location.href = '單字後台管理.html';
      } else {
        document.getElementById('modal-pass-error').style.display = 'block';
        document.getElementById('modal-pass-input').value = '';
        document.getElementById('modal-pass-input').focus();
      }
    }
  </script>
</body>
</html>
