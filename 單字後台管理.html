<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專二餐服 教師即時後台管理系統</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a 60%, #020617);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-bar h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--glass-shadow);
      margin-bottom: 24px;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .tab-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .form-control {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
      width: 100%;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      background: rgba(15, 23, 42, 0.7);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      display: flex;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-emerald));
    }

    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-pass {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .stat-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
    }
    .stat-val {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-top: 4px;
    }

    /* Password Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Password Verification Modal -->
  <div id="password-modal" class="modal-overlay">
    <div class="glass-card modal-content">
      <div style="font-size: 3rem; color: var(--primary); margin-bottom: 12px;">
        <i class="fa-solid fa-user-lock"></i>
      </div>
      <h2 style="font-family: 'Outfit', sans-serif; margin-bottom: 10px;">教師權限密碼驗證</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px;">此區域僅限教師存取，請輸入管理密碼</p>
      
      <form id="password-form" onsubmit="verifyPassword(event)">
        <div style="margin-bottom: 16px;">
          <input type="password" id="password-input" class="form-control" placeholder="請輸入教師管理密碼" required autofocus>
        </div>
        <div id="password-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 14px; display: none;">
          <i class="fa-solid fa-circle-exclamation"></i> 密碼錯誤，請重新輸入！
        </div>
        <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 12px;">
          <i class="fa-solid fa-key"></i> 驗證並進入後台
        </button>
      </form>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="dashboard-container" style="display: none;">
    <div class="header-bar">
      <div>
        <h1>專二餐服 教師即時後台管理系統 <span style="font-size:0.9rem; font-weight:normal; color:var(--accent-emerald);"><i class="fa-solid fa-shield-halved"></i> 已授權驗證</span></h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">從課本第3頁起，每兩頁一關 (Level 1 = P.3~P.4, Level 2 = P.5~P.6...)</p>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-emerald" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> 匯出全班 Excel 報表</button>
        <button class="btn" style="background: rgba(255,255,255,0.1);" onclick="generateMockData()"><i class="fa-solid fa-wand-magic-sparkles"></i> 載入模擬測試數據</button>
        <button class="btn" style="background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4);" onclick="logoutTeacher()"><i class="fa-solid fa-lock"></i> 鎖定登出</button>
      </div>
    </div>

    <div class="stat-card-grid">
      <div class="stat-card">
        <span style="font-size: 0.85rem; color: var(--text-muted);">總學生人數</span>
        <div class="stat-val" id="stat-total-students">80 人</div>
      </div>
      <div class="stat-card">
        <span style="font-size: 0.85rem; color: var(--text-muted);">平均解鎖進度</span>
        <div class="stat-val" id="stat-avg-progress" style="color: var(--accent-emerald);">0%</div>
      </div>
      <div class="stat-card">
        <span style="font-size: 0.85rem; color: var(--text-muted);">已完成 49 關人數</span>
        <div class="stat-val" id="stat-completed-count" style="color: var(--accent-amber);">0 人</div>
      </div>
    </div>

    <div class="glass-card">
      <div class="tab-group">
        <button class="tab-btn active" id="tab-overview" onclick="switchView('overview')"><i class="fa-solid fa-chart-pie"></i> 學生進度總覽模式</button>
        <button class="tab-btn" id="tab-level" onclick="switchView('level')"><i class="fa-solid fa-layer-group"></i> 單關詳細檢視模式</button>
      </div>

      <div class="filter-bar">
        <label style="font-size: 0.9rem; color: var(--text-muted);"><i class="fa-solid fa-filter"></i> 篩選年級：</label>
        <select class="form-control" id="filter-grade" style="width: auto;" onchange="renderCurrentView()">
          <option value="all">全部年級 (2年級 & 3年級)</option>
          <option value="2">2 年級</option>
          <option value="3">3 年級</option>
        </select>

        <div id="level-select-container" style="display: none; align-items: center; gap: 10px;">
          <label style="font-size: 0.9rem; color: var(--text-muted);">選擇檢視關卡：</label>
          <select class="form-control" id="select-level-inspect" style="width: auto;" onchange="renderCurrentView()">
            <!-- Added dynamically -->
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table id="main-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    // 教師預設管理密碼 (預設: teacher888)
    const TEACHER_PASSWORD = "teacher888";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyADnoZbEbfLg9e8CcebJ9k6xhMZdkAXDmk",
      authDomain: "vocab-game-demo.firebaseapp.com",
      databaseURL: "https://vocab-game-demo-default-rtdb.firebaseio.com",
      projectId: "vocab-game-demo",
      storageBucket: "vocab-game-demo.firebasestorage.app",
      messagingSenderId: "949892572092",
      appId: "1:949892572092:web:7fd8b5adaef7d7c48381b9",
      measurementId: "G-EJG8M94162"
    };

    let db = null;
    let scoresData = [];
    let currentViewMode = 'overview';

    document.addEventListener('DOMContentLoaded', () => {
      // 每次開啟或重新整理網頁均強制鎖定，須輸入密碼解鎖
      sessionStorage.removeItem('teacher_authenticated');
      checkAuth();
    });

    function checkAuth() {
      const isAuth = sessionStorage.getItem('teacher_authenticated');
      if (isAuth === 'true') {
        document.getElementById('password-modal').style.display = 'none';
        document.getElementById('dashboard-container').style.display = 'block';
        initDashboard();
      } else {
        document.getElementById('password-modal').style.display = 'flex';
        document.getElementById('dashboard-container').style.display = 'none';
      }
    }

    function verifyPassword(e) {
      e.preventDefault();
      const inputPass = document.getElementById('password-input').value.trim();

      if (inputPass === TEACHER_PASSWORD) {
        sessionStorage.setItem('teacher_authenticated', 'true');
        document.getElementById('password-error').style.display = 'none';
        document.getElementById('password-modal').style.display = 'none';
        document.getElementById('dashboard-container').style.display = 'block';
        initDashboard();
      } else {
        document.getElementById('password-error').style.display = 'block';
        document.getElementById('password-input').value = '';
        document.getElementById('password-input').focus();
      }
    }

    function logoutTeacher() {
      sessionStorage.removeItem('teacher_authenticated');
      location.reload();
    }

    function initDashboard() {
      initLevelSelectOptions();
      try {
        if (firebase.apps.length === 0) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        listenFirebase();
      } catch(e) {
        console.warn("使用本地模擬數據");
      }
      generateMockData();
    }

    function initLevelSelectOptions() {
      const sel = document.getElementById('select-level-inspect');
      sel.innerHTML = '';
      for (let i = 1; i <= 49; i++) {
        const startP = 3 + (i - 1) * 2;
        const endP = startP + 1;
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Level ${i} (課本 P.${startP}~P.${endP})`;
        sel.appendChild(opt);
      }
    }

    function listenFirebase() {
      if (db) {
        db.ref('scores').on('value', snapshot => {
          const val = snapshot.val();
          if (val) {
            scoresData = Object.values(val);
            renderCurrentView();
          }
        });
      }
    }

    function switchView(mode) {
      currentViewMode = mode;
      document.getElementById('tab-overview').classList.toggle('active', mode === 'overview');
      document.getElementById('tab-level').classList.toggle('active', mode === 'level');
      document.getElementById('level-select-container').style.display = (mode === 'level') ? 'flex' : 'none';
      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentViewMode === 'overview') {
        renderOverviewTable();
      } else {
        renderLevelTable();
      }
    }

    function renderOverviewTable() {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      const gradeFilter = document.getElementById('filter-grade').value;

      thead.innerHTML = `
        <tr>
          <th>年級</th>
          <th>座號</th>
          <th>最高解鎖關卡 (頁碼)</th>
          <th>總完成進度 (% / 49關)</th>
          <th>累積挑戰次數</th>
          <th>狀態</th>
        </tr>
      `;

      tbody.innerHTML = '';

      let totalStudents = 0;
      let sumUnlocked = 0;
      let completedCount = 0;

      for (let g of [2, 3]) {
        if (gradeFilter !== 'all' && parseInt(gradeFilter) !== g) continue;

        for (let s = 1; s <= 40; s++) {
          totalStudents++;
          const studentScores = scoresData.filter(item => item.grade === g && item.seat_no === s);
          const passedLevels = new Set(studentScores.filter(i => i.score >= 85).map(i => i.level));
          const maxUnlocked = Math.min(49, passedLevels.size + 1);

          sumUnlocked += maxUnlocked;
          if (maxUnlocked >= 49) completedCount++;

          const pct = Math.round((passedLevels.size / 49) * 100);
          const startP = 3 + (maxUnlocked - 1) * 2;
          const endP = startP + 1;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b style="color:var(--accent-cyan);">${g} 年級</b></td>
            <td>${s} 號</td>
            <td><span style="font-weight:700;">Level ${maxUnlocked}</span> (P.${startP}~P.${endP})</td>
            <td>
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="progress-bar" style="width:140px;">
                  <div class="progress-fill" style="width:${pct}%;"></div>
                </div>
                <span>${pct}%</span>
              </div>
            </td>
            <td>${studentScores.length} 次</td>
            <td>
              <span class="badge ${passedLevels.size >= 49 ? 'badge-pass' : 'badge-fail'}">
                ${passedLevels.size >= 49 ? '已全通關 🏆' : '闖關中'}
              </span>
            </td>
          `;
          tbody.appendChild(tr);
        }
      }

      document.getElementById('stat-total-students').innerText = `${totalStudents} 人`;
      document.getElementById('stat-avg-progress').innerText = `${totalStudents ? Math.round(((sumUnlocked / totalStudents) / 49) * 100) : 0}%`;
      document.getElementById('stat-completed-count').innerText = `${completedCount} 人`;
    }

    function renderLevelTable() {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      const gradeFilter = document.getElementById('filter-grade').value;
      const targetLevel = parseInt(document.getElementById('select-level-inspect').value);

      const startP = 3 + (targetLevel - 1) * 2;
      const endP = startP + 1;

      thead.innerHTML = `
        <tr>
          <th>年級</th>
          <th>座號</th>
          <th>關卡 (頁碼)</th>
          <th>最高得分</th>
          <th>挑戰次數</th>
          <th>最近挑戰時間</th>
          <th>通關狀態</th>
        </tr>
      `;

      tbody.innerHTML = '';

      for (let g of [2, 3]) {
        if (gradeFilter !== 'all' && parseInt(gradeFilter) !== g) continue;

        for (let s = 1; s <= 40; s++) {
          const records = scoresData.filter(i => i.grade === g && i.seat_no === s && i.level === targetLevel);
          const maxScore = records.length > 0 ? Math.max(...records.map(r => r.score)) : null;
          const lastRecord = records.length > 0 ? records[records.length - 1].completed_at : null;
          const isPassed = maxScore !== null && maxScore >= 85;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${g} 年級</td>
            <td>${s} 號</td>
            <td>Level ${targetLevel} (P.${startP}~P.${endP})</td>
            <td><b style="color:${maxScore >= 85 ? 'var(--accent-emerald)' : 'var(--accent-amber)'};">${maxScore !== null ? maxScore + '分' : '未挑戰'}</b></td>
            <td>${records.length} 次</td>
            <td style="font-size:0.8rem; color:var(--text-muted);">${lastRecord ? new Date(lastRecord).toLocaleString('zh-TW') : '-'}</td>
            <td>
              <span class="badge ${isPassed ? 'badge-pass' : 'badge-fail'}">
                ${isPassed ? '已通過 (>=85分)' : '未及格 / 未挑戰'}
              </span>
            </td>
          `;
          tbody.appendChild(tr);
        }
      }
    }

    function exportToExcel() {
      const matrix = [];
      const header = ["年級", "座號", "完成關卡數", "進度(%)"];
      for (let i = 1; i <= 49; i++) {
        const startP = 3 + (i - 1) * 2;
        const endP = startP + 1;
        header.push(`Level_${i}_(P.${startP}-P.${endP})_最高分`);
      }
      matrix.push(header);

      for (let g of [2, 3]) {
        for (let s = 1; s <= 40; s++) {
          const studentScores = scoresData.filter(item => item.grade === g && item.seat_no === s);
          const passedCount = new Set(studentScores.filter(i => i.score >= 85).map(i => i.level)).size;
          const pct = Math.round((passedCount / 49) * 100);

          const row = [g, s, passedCount, `${pct}%`];

          for (let i = 1; i <= 49; i++) {
            const levelScores = studentScores.filter(item => item.level === i).map(item => item.score);
            row.push(levelScores.length > 0 ? Math.max(...levelScores) : 0);
          }

          matrix.push(row);
        }
      }

      const ws = XLSX.utils.aoa_to_sheet(matrix);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "專二餐服單字成績總表");

      XLSX.writeFile(wb, "專二餐服_雲端單字闖關全班成績總表.xlsx");
    }

    function generateMockData() {
      scoresData = [];
      const now = new Date();

      for (let g of [2, 3]) {
        for (let s = 1; s <= 40; s++) {
          const maxLvl = Math.floor(Math.random() * 12) + 1;
          for (let l = 1; l <= maxLvl; l++) {
            const score = Math.floor(Math.random() * 25) + 78;
            scoresData.push({
              grade: g,
              seat_no: s,
              level: l,
              score: score,
              completed_at: new Date(now.getTime() - Math.random() * 86400000 * 5).toISOString()
            });
          }
        }
      }
      renderCurrentView();
    }
  </script>
</body>
</html>
